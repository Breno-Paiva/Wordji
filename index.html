<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordji Taipi</title>
<style>
  :root {
    --cream: #f4eee0;
    --cream-panel: #ece2c8;
    --ink: #33291f;
    --mustard: #e0a530;
    --mustard-deep: #b9841f;
    --olive: #6f8c44;
    --olive-deep: #4f6b2f;
    --sky-blue: #9dc0be;
    --terracotta: #c1552c;
    --terracotta-deep: #8f3d1e;
    --font-display: "Arial Rounded MT Bold", "Baloo 2", "Century Gothic", ui-rounded, "Segoe UI", sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Dark mode — same poster palette, inverted: --ink flips light-on-dark,
     and the "-deep" accent variants flip from darker-than-base (for text on
     light --cream-panel) to lighter-than-base (for text on dark --cream-panel),
     preserving their role as "the legible-as-text variant of this hue". */
  :root[data-theme="dark"] {
    --cream: #1f1a14;
    --cream-panel: #2b2419;
    --ink: #f0e8d8;
    --mustard: #e6b04c;
    --mustard-deep: #f0c66b;
    --olive: #7fa050;
    --olive-deep: #9cc26a;
    --sky-blue: #9dc0be;
    --terracotta: #d1663a;
    --terracotta-deep: #e2895f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--cream);
  }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: radial-gradient(circle at 50% 0%, #faf5e6 0%, var(--cream) 65%);
    background-attachment: fixed;
  }
  :root[data-theme="dark"] body {
    background: radial-gradient(circle at 50% 0%, #332c1f 0%, var(--cream) 65%);
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .title-text {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 7vw, 4.4rem);
    font-weight: 900;
    margin: 0 0 8px 0;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    color: var(--mustard);
    -webkit-text-stroke: 1.5px var(--ink);
    text-shadow: 3px 3px 0 rgba(51,41,31,0.15);
  }

  .poster-scene {
    width: min(88vw, 480px);
    aspect-ratio: 600 / 340;
    margin: 14px 0 6px 0;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 5px 5px 0 rgba(51,41,31,0.18);
  }
  .poster-scene svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .content-layer {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* Instructions */
  .instructions-box {
    max-width: 560px;
    max-height: 62vh;
    overflow-y: auto;
    text-align: left;
    background: var(--cream-panel);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 rgba(51,41,31,0.15);
    padding: 22px 26px;
    line-height: 1.7;
    color: var(--ink);
  }
  .instructions-box ul {
    padding-left: 20px;
    margin: 0;
    font-family: var(--font-body);
    font-weight: 500;
  }

  /* Round select */
  .round-options {
    display: flex;
    gap: 20px;
    margin: 24px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .round-option {
    padding: 18px 26px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--cream-panel);
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--ink);
    font-size: 1.3rem;
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .round-option .key-hint {
    display: block;
    font-family: var(--font-body);
    font-size: 0.65rem;
    color: var(--olive-deep);
    margin-top: 6px;
    letter-spacing: 0.15em;
  }
  .round-option.selected {
    border-color: var(--terracotta-deep);
    box-shadow: 5px 5px 0 var(--terracotta-deep);
    transform: translate(-2px, -2px);
  }
  .round-option.mode-option {
    max-width: 240px;
  }
  .mode-option-desc {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--ink);
    opacity: 0.75;
    line-height: 1.4;
    margin-top: 6px;
  }

  /* Verb settings screen — checkboxes + toggle */
  .settings-section-label {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--olive-deep);
    margin: 18px 0 6px 0;
  }
  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 520px;
    margin: 0 0 8px 0;
  }
  .checkbox-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    background: var(--cream-panel);
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--ink);
    font-size: 0.95rem;
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .checkbox-chip.checked {
    border-color: var(--olive-deep);
    box-shadow: 4px 4px 0 var(--olive-deep);
    transform: translate(-1px, -1px);
  }
  .checkbox-chip .check-mark {
    width: 20px;
    height: 20px;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 900;
    flex-shrink: 0;
    color: transparent;
  }
  .checkbox-chip.checked .check-mark {
    background: var(--olive);
    border-color: var(--olive-deep);
    color: #fff;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0 20px 0;
    cursor: pointer;
  }
  .toggle-switch {
    width: 46px;
    height: 26px;
    border-radius: 13px;
    border: 3px solid var(--ink);
    background: var(--cream-panel);
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .toggle-switch .toggle-knob {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 0.15s, background 0.15s;
  }
  .toggle-switch.on {
    background: var(--olive);
    border-color: var(--olive-deep);
  }
  .toggle-switch.on .toggle-knob {
    transform: translateX(20px);
    background: #fff;
  }
  .toggle-label {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--ink);
    font-size: 0.95rem;
  }

  /* Game screen */
  .game-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
  }

  .timer-bar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    padding: 6px 24px;
    border: 3px solid var(--ink);
    border-radius: 30px;
    background: var(--cream-panel);
    color: var(--olive-deep);
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    z-index: 10;
  }
  .timer-bar.low {
    color: var(--terracotta-deep);
    border-color: var(--terracotta-deep);
  }

  .word-display {
    font-family: var(--font-display);
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 900;
    text-transform: uppercase;
    color: var(--ink);
    margin-top: 40px;
    min-height: 1.4em;
  }

  .category-tag {
    font-family: var(--font-body);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--olive-deep);
    margin-top: -10px;
  }

  /* Tense badge (verb mode) — a modifier on .category-tag rather than a
     change to it, so vocab mode's plain category caption is untouched.
     Uses the same poster font as the pronoun (.word-display) instead of
     the small letter-spaced body font, so it reads at a glance. */
  .category-tag.tense-badge {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .infinitive-label {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--olive-deep);
    margin-top: -6px;
  }

  .box-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90vw;
  }

  .box-row.shake, .name-input.shake {
    animation: jiggle 0.4s ease;
  }

  @keyframes jiggle {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
  }

  .letter-box {
    width: 48px;
    height: 56px;
    border-radius: 8px;
    background: var(--cream-panel);
    border: 3px solid var(--ink);
    box-shadow: 2px 2px 0 rgba(51,41,31,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--ink);
    transition: border-color 0.15s;
  }

  /* One wide box for conjugated verb forms (typed as a whole word), instead
     of the per-letter boxes used for translating — same look, just sized to
     fit the full answer rather than split into individual letter cells. */
  .letter-box.wide {
    width: auto;
    min-width: 140px;
    padding: 0 22px;
    letter-spacing: 0.02em;
  }

  .letter-box.flash-correct {
    animation: flash-green 0.5s ease;
  }
  .letter-box.flash-wrong {
    animation: flash-red 0.5s ease;
  }
  .letter-box.flash-skip {
    animation: flash-skip 0.7s ease;
  }
  .letter-box.reveal {
    border-color: var(--mustard-deep);
    background: var(--mustard);
    /* Literal, not var(--ink) — this sits on a fixed bright mustard fill in
       both themes, so it needs to stay dark for contrast even when --ink
       flips light for dark mode. */
    color: #33291f;
  }

  @keyframes flash-green {
    0%   { background: var(--cream-panel); border-color: var(--ink); color: var(--ink); }
    40%  { background: var(--olive); border-color: var(--olive-deep); color: #fff; }
    100% { background: var(--cream-panel); border-color: var(--ink); color: var(--ink); }
  }
  @keyframes flash-red {
    0%   { background: var(--cream-panel); border-color: var(--ink); color: var(--ink); }
    40%  { background: var(--terracotta); border-color: var(--terracotta-deep); color: #fff; }
    100% { background: var(--cream-panel); border-color: var(--ink); color: var(--ink); }
  }
  @keyframes flash-skip {
    0%   { background: var(--cream-panel); border-color: var(--ink); }
    30%  { background: var(--sky-blue); border-color: var(--olive-deep); }
    70%  { background: var(--sky-blue); border-color: var(--olive-deep); }
    100% { background: var(--cream-panel); border-color: var(--ink); }
  }

  .status-line {
    min-height: 1.6em;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--terracotta-deep);
  }
  .status-line.reveal-text {
    font-family: var(--font-display);
    color: var(--mustard-deep);
    font-size: 1.3rem;
    font-weight: 900;
  }

  .bonus-popup {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--olive-deep);
    background: var(--cream-panel);
    border: 3px solid var(--olive-deep);
    border-radius: 12px;
    padding: 14px 28px;
    box-shadow: 4px 4px 0 rgba(51,41,31,0.2);
    z-index: 50;
    animation: popup-in 0.6s ease forwards;
    pointer-events: none;
  }
  @keyframes popup-in {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    35%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }

  .hidden-input {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    top: -100px;
    left: -100px;
    width: 1px;
    height: 1px;
  }

  /* Score screen */
  .score-value {
    font-family: var(--font-display);
    font-size: clamp(2rem, 8vw, 3.4rem);
    font-weight: 900;
    color: var(--olive-deep);
    text-align: center;
    margin: 8px 0 4px 0;
  }
  .high-score-line {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    opacity: 0.75;
    margin-bottom: 10px;
  }
  .high-score-line.new-high-score {
    color: var(--terracotta-deep);
    opacity: 1;
    font-size: 1.3rem;
    animation: high-score-pop 0.5s ease;
  }
  @keyframes high-score-pop {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  .result-message {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .result-message.tier-fire {
    color: var(--terracotta-deep);
  }
  .result-message.tier-good {
    color: var(--olive-deep);
  }
  .result-message.tier-meh {
    color: var(--mustard-deep);
  }
  .result-message.tier-bad {
    color: #7a2f18;
  }
  :root[data-theme="dark"] .result-message.tier-bad {
    color: #e0765a;
  }

  .secondary-btn {
    margin-top: 14px;
    padding: 10px 22px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    background: var(--cream-panel);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .secondary-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(51,41,31,0.15); }
  .secondary-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(51,41,31,0.15); }
  .secondary-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  .score-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .primary-btn {
    background: var(--mustard);
    border-color: var(--ink);
    /* Literal, not var(--ink) — this sits on a fixed bright mustard fill in
       both themes, so it needs to stay dark for contrast even when --ink
       flips light for dark mode. */
    color: #33291f;
  }
  .primary-btn:hover { background: var(--mustard-deep); }

  .danger-btn {
    background: var(--terracotta);
    border-color: var(--ink);
    /* Literal, not var(--ink) — same reasoning as .primary-btn: this sits on
       a fixed bright fill in both themes, so text needs to stay dark. */
    color: #33291f;
  }
  .danger-btn:hover { background: var(--terracotta-deep); }

  /* Settings screen — name section row */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 10px 0 20px 0;
  }
  .settings-row .settings-value {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--ink);
  }

  /* Confirmation modal (e.g. clearing high scores) — overlay on top of
     whatever screen opened it, not a separate navigation state. */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,16,12,0.55);
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-card {
    background: var(--cream-panel);
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 6px 6px 0 rgba(51,41,31,0.25);
    padding: 26px 30px;
    max-width: 90vw;
    width: 380px;
    text-align: center;
  }
  .modal-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--ink);
    margin: 0 0 10px 0;
  }
  .modal-text {
    font-family: var(--font-body);
    color: var(--ink);
    line-height: 1.6;
    margin: 0 0 18px 0;
    font-size: 0.95rem;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--olive-deep);
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .back-link:hover { color: var(--terracotta-deep); }

  /* Answers list (embedded in the score screen) */
  .answers-list {
    width: 90vw;
    max-width: 560px;
    max-height: 26vh;
    overflow-y: auto;
    background: var(--cream-panel);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 rgba(51,41,31,0.15);
    padding: 6px 18px;
    margin: 4px 0 16px 0;
    text-align: left;
  }

  /* High scores screen — same panel look as the answers list, just taller
     since it holds two sections (Vocabulário / Verbos) instead of one round. */
  .highscore-panel {
    width: 90vw;
    max-width: 560px;
    max-height: 55vh;
    overflow-y: auto;
    background: var(--cream-panel);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 rgba(51,41,31,0.15);
    padding: 6px 18px 14px 18px;
    margin: 10px 0 16px 0;
    text-align: left;
  }
  .highscore-panel .settings-section-label:first-child { margin-top: 10px; }

  .answers-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(51,41,31,0.15);
    font-family: var(--font-body);
  }
  .answers-row:last-child { border-bottom: none; }
  .answers-row .answers-words { font-weight: 600; }
  .answers-row .answers-mark {
    font-family: var(--font-display);
    font-weight: 900;
    flex-shrink: 0;
  }
  .answers-row.correct .answers-mark { color: var(--olive-deep); }
  .answers-row.wrong .answers-mark { color: var(--terracotta-deep); }
  .answers-row.neutral .answers-mark { color: rgba(51,41,31,0.45); }
  :root[data-theme="dark"] .answers-row.neutral .answers-mark { color: rgba(240,232,216,0.5); }
  .answers-empty {
    padding: 20px;
    color: rgba(51,41,31,0.6);
    font-family: var(--font-body);
  }
  :root[data-theme="dark"] .answers-empty { color: rgba(240,232,216,0.55); }

  button.link-btn {
    background: transparent;
    border: none;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
  }

  .mute-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: var(--cream-panel);
    color: var(--ink);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    transition: transform 0.15s;
  }
  .mute-btn:hover { transform: scale(1.06); }
  .mute-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(51,41,31,0.15); }

  .settings-btn {
    position: fixed;
    top: 70px;
    right: 16px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: var(--cream-panel);
    color: var(--ink);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0 rgba(51,41,31,0.15);
    transition: transform 0.15s;
  }
  .settings-btn:hover { transform: scale(1.06); }

  /* =========================================================
   * Sound effects — synthesized via Web Audio API, no audio
   * files/network requests so the game stays self-contained.
   * ========================================================= */
  let muted = false;
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, startOffset, duration, type, peakVolume) {
    if (muted) return;
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const now = ctx.currentTime + startOffset;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(peakVolume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playClickSound() { playTone(440, 0, 0.06, "sine", 0.12); }
  function playBlipSound() { playTone(300, 0, 0.05, "sine", 0.08); }

    playTone(400, 0, 0.15, "triangle", 0.16);
    playTone(300, 0.12, 0.15, "triangle", 0.16);
    playTone(200, 0.24, 0.25, "triangle", 0.16);

  /* =========================================================
   * Dark mode persistence (localStorage, same rationale as high scores —
   * remembers the player's last choice across sessions)
   * ========================================================= */
  const DARK_MODE_STORAGE_KEY = "wordjiTaipiDarkMode";

  function loadDarkMode() {
    try {
      return localStorage.getItem(DARK_MODE_STORAGE_KEY) === "1";
    } catch (err) {
      return false;
    }
  }

  function saveDarkMode(isDark) {
    try {
      localStorage.setItem(DARK_MODE_STORAGE_KEY, isDark ? "1" : "0");
    } catch (err) {
      // localStorage unavailable — theme choice just won't persist this session.
    }
  }

  let darkMode = loadDarkMode();

  function applyDarkMode() {
    document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  }
  applyDarkMode();

  /* =========================================================
   * State machine
   * ========================================================= */
  const app = document.getElementById("app");

  let state = "title";
  // Nullable until explicitly chosen — Mode Select's Continue and Vocab
  // Settings'/Round Select's Begin buttons stay disabled while their
  // relevant picks are still null (see the render functions below).
  let selectedDuration = null;
  let selectedDifficulty = null;
  let displayLanguage = null;
  let gameMode = null; // "vocab" | "verb"

  // Verb mode settings (Verb Settings screen) — no difficulty tiers drive
  // the main verb/tense/pronoun pool here; the player directly controls
  // round population (verbConjugationFeature.md §5). selectedVerbDifficulty
  // is a separate, narrower control: it only applies (and is only shown)
  // when translateFirst is on, scoping which verbs' English glosses need
  // translating — a hard verb to conjugate isn't necessarily a hard verb
  // to translate, so this stays independent of the tense/pronoun checkboxes.
  let selectedTenses = { presente: true, preterito_perfeito: false, preterito_imperfeito: false, futuro_presente: false };
  let selectedPronouns = { eu: true, voce: true, nos: true, eles: true };
  let translateFirst = false;
  let selectedVerbDifficulty = "medium";

  // Game-round state
  let currentPool = [];
  let roundQueue = [];
  let queueIndex = 0;
  let currentWord = null;
  let currentWordResolved = false;
  let currentPronounLabel = ""; // the alias actually shown for the current verbConjugate prompt
  let attemptCount = 0;
  let score = 0;
  let roundHistory = [];
  let timeRemaining = 0;
  let timerHandle = null;
  let inputLocked = false;
  let isNewHighScore = false;
  let settingsBtnEl = null;
  let highScoreBtnEl = null;
  let helpBtnEl = null;
  // Whether the "clear high scores" confirmation modal is showing — an
  // overlay on top of the settings screen, not its own navigation state.
  let showClearConfirm = false;

  /* =========================================================
   * High score persistence (localStorage — not cookies; cookies are
   * unreliable/blocked on file:// pages, localStorage is the right tool
   * for local-file data that just needs to survive between sessions)
   * ========================================================= */
  const HIGH_SCORE_STORAGE_KEY = "wordjiTaipiHighScores";
  // Verb mode uses a separate bucket/key scheme — the checkbox settings are too
  // combinatorial to bucket per-exact-combination the way vocab mode buckets by
  // difficulty x language x length, so verb high scores are scoped only by
  // translate-first x round length (verbConjugationFeature.md §7).
  const VERB_HIGH_SCORE_STORAGE_KEY = "wordjiTaipiVerbHighScores";

  function loadScoresFromKey(storageKey) {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : {};
    } catch (err) {
      return {};
    }
  }

  function saveScoresToKey(storageKey, scores) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(scores));
    } catch (err) {
      // localStorage unavailable (private browsing, disabled storage, etc.) —
      // fail silently, high scores just won't persist this session.
    }
  }

  function currentHighScoreStorageKey() {
    return gameMode === "verb" ? VERB_HIGH_SCORE_STORAGE_KEY : HIGH_SCORE_STORAGE_KEY;
  }

  function getHighScoreKey() {
    if (gameMode === "verb") {
      return (translateFirst ? "translate" : "notranslate") + "_" + selectedDuration;
    }
    return selectedDifficulty + "_" + displayLanguage + "_" + selectedDuration;
  }

  function getHighScore() {
    const scores = loadScoresFromKey(currentHighScoreStorageKey());
    return scores[getHighScoreKey()] || 0;
  }

  // Returns true if this round's score set a new high score.
  function recordHighScoreIfNeeded() {
    const storageKey = currentHighScoreStorageKey();
    const scores = loadScoresFromKey(storageKey);
    const key = getHighScoreKey();
    const prevBest = scores[key] || 0;
    if (score > prevBest) {
      scores[key] = score;
      saveScoresToKey(storageKey, scores);
      return true;
    }
    return false;
  }

  /* =========================================================
   * User name persistence (localStorage, same rationale as high scores)
   * ========================================================= */
  const USER_NAME_STORAGE_KEY = "wordjiTaipiUserName";
  const NAME_MAX_LENGTH = 20;

  function loadUserName() {
    try {
      return localStorage.getItem(USER_NAME_STORAGE_KEY) || null;
    } catch (err) {
      return null;
    }
  }

  function saveUserName(name) {
    try {
      localStorage.setItem(USER_NAME_STORAGE_KEY, name);
    } catch (err) {
      // localStorage unavailable — name just won't persist this session.
    }
  }

  function getGreeting() {
    const hour = new Date().getHours();
    if (hour < 12) return "Bom dia";
    if (hour < 18) return "Boa tarde";
    return "Boa noite";
  }

  let userName = loadUserName();
  // Which state to return to after the name-entry screen — wherever it was
  // opened from (directly from the settings screen's Edit button, most of
  // the time now; name entry is voluntary-only, never forced, so this is
  // always overwritten before setState("nameEntry") runs).
  let nameEntryReturnState = "title";
  // Which state to return to after the high-scores screen — wherever the
  // trophy button was pressed from, same pattern as nameEntryReturnState.
  let highScoresReturnState = "title";
  // Which state to return to after the help screen — wherever the
  // question-mark button was pressed from, same pattern.
  let helpReturnState = "title";
  // Which state to return to after the settings screen — wherever the
  // gear button was pressed from, same pattern.
  let settingsReturnState = "title";

  function setState(next) {
    state = next;
    render();
  }

  function render() {
    app.innerHTML = "";
    // Settings (name + clear high scores) is only ever reached via the gear
    // button — always visible except on the settings screen itself.
    if (settingsBtnEl) settingsBtnEl.style.display = (state !== "settings") ? "flex" : "none";
    if (highScoreBtnEl) highScoreBtnEl.style.display = (state !== "highScores") ? "flex" : "none";
    if (helpBtnEl) helpBtnEl.style.display = (state !== "help") ? "flex" : "none";
    if (state === "title") renderTitle();
    else if (state === "nameEntry") renderNameEntry();
    else if (state === "modeSelect") renderModeSelect();
    else if (state === "vocabSettings") renderVocabSettings();
    else if (state === "verbSettings") renderVerbSettings();
    else if (state === "game") renderGame();
    else if (state === "score") renderScore();
    else if (state === "highScores") renderHighScores();
    else if (state === "help") renderHelp();
    else if (state === "settings") renderSettings();
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  /* =========================================================
   * Name entry screen
   * ========================================================= */
  function renderNameEntry() {
    const layer = el("div", "content-layer");
    const isEditing = !!userName;

    const heading = el("h2", "title-text", isEditing ? "Change Your Name" : "What's Your Name?");
    heading.style.fontSize = "2rem";

    const input = document.createElement("input");
    input.type = "text";
    input.className = "name-input";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.maxLength = NAME_MAX_LENGTH;
    input.value = userName || "";

    const error = el("div", "name-error", "");

    function trySaveName() {
      const value = input.value.trim();
      if (!value) {
        error.textContent = "Please enter a name.";
        input.classList.remove("shake");
        void input.offsetWidth;
        input.classList.add("shake");
        return;
      }
      userName = value.slice(0, NAME_MAX_LENGTH);
      saveUserName(userName);
      playClickSound();
      setState(nameEntryReturnState);
    }

    input.addEventListener("keydown", (e) => {
      // Stop propagation so this key never reaches the document-level
      // handler below — trySaveName() can change `state` synchronously,
      // and letting the same event bubble up would let the *new* state's
      // Enter-handling fire too, cascading two transitions from one keypress.
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); trySaveName(); }
    });

    const buttonRow = el("div", "score-buttons");
    const saveBtn = el("button", "secondary-btn primary-btn", "Save");
    saveBtn.type = "button";
    saveBtn.addEventListener("click", trySaveName);
    buttonRow.appendChild(saveBtn);

    // Always cancelable now — this screen is only ever reached voluntarily
    // (via Settings' Edit button), so there's no "mandatory, nothing to
    // cancel back to" case anymore.
    const cancelBtn = el("button", "secondary-btn", "Cancel");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", () => { playClickSound(); setState(nameEntryReturnState); });
    buttonRow.appendChild(cancelBtn);

    layer.appendChild(heading);
    layer.appendChild(input);
    layer.appendChild(error);
    layer.appendChild(buttonRow);
    app.appendChild(layer);

    input.focus();
    input.select();
  }

  /* =========================================================
   * Instructions screen
   * ========================================================= */
  /* =========================================================
   * Mode select screen — Vocabulário (existing word game) vs.
   * Verbos (conjugation drill, verbConjugationFeature.md)
   * ========================================================= */
  const MODE_OPTIONS = ["vocab", "verb"];
  const MODE_LABELS = { vocab: "Vocabulário", verb: "Verbos" };
  const MODE_DESCRIPTIONS = {
    vocab: "Translate everyday words between English and Portuguese.",
    verb: "Conjugate Portuguese verbs across pronouns and tenses."
  };

  // Vocabulário and Verbos each head into their own combined settings page.
  // Only reachable once gameMode is actually picked — see renderModeSelect's
  // disabled Continue button below.
  function goToModeNextScreen() {
    setState(gameMode === "verb" ? "verbSettings" : "vocabSettings");
  }

  function renderModeSelect() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Mode");
    heading.style.fontSize = "2rem";

    const optionsRow = el("div", "round-options");
    MODE_OPTIONS.forEach((mode, idx) => {
      const opt = el("div", "round-option mode-option" + (mode === gameMode ? " selected" : ""));
      opt.appendChild(el("div", "", MODE_LABELS[mode]));
      opt.appendChild(el("div", "mode-option-desc", MODE_DESCRIPTIONS[mode]));
      opt.appendChild(el("span", "key-hint", "PRESS " + (idx + 1)));
      opt.addEventListener("click", () => {
        gameMode = mode;
        playClickSound();
        render();
      });
      optionsRow.appendChild(opt);
    });

    const continueBtn = el("button", "secondary-btn primary-btn", "Continue");
    continueBtn.type = "button";
    continueBtn.disabled = (gameMode === null);
    continueBtn.addEventListener("click", () => { playClickSound(); goToModeNextScreen(); });

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState("title"); });

    layer.appendChild(heading);
    layer.appendChild(optionsRow);
    layer.appendChild(continueBtn);
    layer.appendChild(backBtn);
    app.appendChild(layer);
  }

  /* =========================================================
   * Vocabulário settings — language direction, difficulty, and round
   * length combined on one page. Nothing is pre-selected; Begin stays
   * disabled until all three are picked.
   * ========================================================= */
  const LANGUAGE_OPTIONS = ["en", "pt"];
  const LANGUAGE_LABELS = { en: "English → Português", pt: "Português → English" };
  const DIFFICULTY_OPTIONS = ["easy", "medium", "hard"];
  const DIFFICULTY_LABELS = { easy: "Turista", medium: "Morador", hard: "Nativo" };
  const ROUND_OPTIONS = [10, 30, 60];

  // Shared single-select option-row builder (click-only — no per-key
  // shortcuts, since combining groups on one page makes numeric shortcuts
  // ambiguous across groups; same simplification the checkbox-based Verb
  // Settings screen already uses).
  function buildOptionRow(options, labelFor, currentValue, onPick) {
    const row = el("div", "round-options");
    options.forEach((value) => {
      const opt = el("div", "round-option" + (value === currentValue ? " selected" : ""));
      opt.appendChild(el("div", "", labelFor(value)));
      opt.addEventListener("click", () => { onPick(value); playClickSound(); render(); });
      row.appendChild(opt);
    });
    return row;
  }

  function renderVocabSettings() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Vocabulário");
    heading.style.fontSize = "2rem";

    const beginBtn = el("button", "secondary-btn primary-btn", "Begin");
    beginBtn.type = "button";
    beginBtn.disabled = !(displayLanguage && selectedDifficulty && selectedDuration);
    beginBtn.addEventListener("click", () => { playClickSound(); startGame(); });

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState("modeSelect"); });

    layer.appendChild(heading);
    layer.appendChild(el("div", "settings-section-label", "Language"));
    layer.appendChild(buildOptionRow(LANGUAGE_OPTIONS, l => LANGUAGE_LABELS[l], displayLanguage, v => { displayLanguage = v; }));
    layer.appendChild(el("div", "settings-section-label", "Difficulty"));
    layer.appendChild(buildOptionRow(DIFFICULTY_OPTIONS, d => DIFFICULTY_LABELS[d], selectedDifficulty, v => { selectedDifficulty = v; }));
    layer.appendChild(el("div", "settings-section-label", "Round Length"));
    layer.appendChild(buildOptionRow(ROUND_OPTIONS, s => s + "s", selectedDuration, v => { selectedDuration = v; }));
    layer.appendChild(beginBtn);
    layer.appendChild(backBtn);
    app.appendChild(layer);
  }

  /* =========================================================
   * Verb settings screen — replaces difficulty tiers for Verbos mode.
   * The player directly controls round population via checkboxes
   * instead of picking a difficulty (verbConjugationFeature.md §5).
   * ========================================================= */
  function checkedTenseCount() { return TENSE_OPTIONS.filter(t => selectedTenses[t]).length; }
  function checkedPronounCount() { return PRONOUN_OPTIONS.filter(p => selectedPronouns[p]).length; }

  function buildCheckboxChip(label, checked, onToggle) {
    const chip = el("div", "checkbox-chip" + (checked ? " checked" : ""));
    chip.tabIndex = 0;
    chip.appendChild(el("div", "check-mark", "✓"));
    chip.appendChild(el("span", "", label));
    chip.addEventListener("click", onToggle);
    chip.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        // Stop propagation so this keypress doesn't also fall through to the
        // document-level handler's Enter-advances-screen behavior (same
        // pattern as the name-entry input's keydown handler).
        e.preventDefault();
        e.stopPropagation();
        onToggle();
      }
    });
    return chip;
  }

  /* =========================================================
   * Verbos settings — one combined page: an expandable "Custom Settings"
   * section (tenses/pronouns/translate-first/translation-difficulty) that's
   * collapsed by default, plus round length and Begin always visible below
   * it. Leaving Custom Settings collapsed just plays with whatever
   * tense/pronoun/translate-first values are already set (session-persisted
   * defaults on first visit) — there's no separate quick-start screen
   * anymore, this page covers both the fast path and the customized one.
   * ========================================================= */
  let verbCustomExpanded = false;

  function checkedTenseCount() { return TENSE_OPTIONS.filter(t => selectedTenses[t]).length; }
  function checkedPronounCount() { return PRONOUN_OPTIONS.filter(p => selectedPronouns[p]).length; }

  function buildCheckboxChip(label, checked, onToggle) {
    const chip = el("div", "checkbox-chip" + (checked ? " checked" : ""));
    chip.tabIndex = 0;
    chip.appendChild(el("div", "check-mark", "✓"));
    chip.appendChild(el("span", "", label));
    chip.addEventListener("click", onToggle);
    chip.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        // Stop propagation so this keypress doesn't also fall through to the
        // document-level handler's Enter-advances-screen behavior (same
        // pattern as the name-entry input's keydown handler).
        e.preventDefault();
        e.stopPropagation();
        onToggle();
      }
    });
    return chip;
  }

  function renderVerbSettings() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Verbos");
    heading.style.fontSize = "2rem";
    layer.appendChild(heading);

    const customBtn = el("button", "secondary-btn", verbCustomExpanded ? "Hide Custom Settings ▴" : "Custom Settings ▾");
    customBtn.type = "button";
    customBtn.addEventListener("click", () => { verbCustomExpanded = !verbCustomExpanded; playClickSound(); render(); });
    layer.appendChild(customBtn);

    if (verbCustomExpanded) {
      const tenseLabel = el("div", "settings-section-label", "Tenses");
      const tenseGroup = el("div", "checkbox-group");
      TENSE_OPTIONS.forEach(tense => {
        const chip = buildCheckboxChip(TENSE_LABELS[tense], selectedTenses[tense], () => {
          // Keep at least one tense checked — an empty pool can't build a round.
          if (selectedTenses[tense] && checkedTenseCount() <= 1) return;
          selectedTenses[tense] = !selectedTenses[tense];
          playClickSound();
          render();
        });
        tenseGroup.appendChild(chip);
      });

      const pronounLabel = el("div", "settings-section-label", "Pronouns");
      const pronounGroup = el("div", "checkbox-group");
      PRONOUN_OPTIONS.forEach(pronoun => {
        const chip = buildCheckboxChip(PRONOUN_CHECKBOX_LABELS[pronoun], selectedPronouns[pronoun], () => {
          if (selectedPronouns[pronoun] && checkedPronounCount() <= 1) return;
          selectedPronouns[pronoun] = !selectedPronouns[pronoun];
          playClickSound();
          render();
        });
        pronounGroup.appendChild(chip);
      });

      const toggleRow = el("div", "toggle-row");
      toggleRow.tabIndex = 0;
      const toggleSwitch = el("div", "toggle-switch" + (translateFirst ? " on" : ""));
      toggleSwitch.appendChild(el("div", "toggle-knob"));
      const toggleLabel = el("div", "toggle-label", "Translate verb first");
      toggleRow.appendChild(toggleSwitch);
      toggleRow.appendChild(toggleLabel);
      const toggleTranslateFirst = () => { translateFirst = !translateFirst; playClickSound(); render(); };
      toggleRow.addEventListener("click", toggleTranslateFirst);
      toggleRow.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          e.stopPropagation();
          toggleTranslateFirst();
        }
      });

      layer.appendChild(tenseLabel);
      layer.appendChild(tenseGroup);
      layer.appendChild(pronounLabel);
      layer.appendChild(pronounGroup);
      layer.appendChild(toggleRow);

      // Only relevant (and only shown) when translate-first is on — it scopes
      // which verbs' English glosses get translated, independent of the
      // tense/pronoun checkboxes above which scope the conjugation step.
      if (translateFirst) {
        layer.appendChild(el("div", "settings-section-label", "Translation Difficulty"));
        layer.appendChild(el("div", "mode-option-desc", "Which verbs get picked for the translation step."));
        layer.appendChild(buildOptionRow(DIFFICULTY_OPTIONS, d => DIFFICULTY_LABELS[d], selectedVerbDifficulty, v => { selectedVerbDifficulty = v; }));
      }
    }

    layer.appendChild(el("div", "settings-section-label", "Round Length"));
    layer.appendChild(buildOptionRow(ROUND_OPTIONS, s => s + "s", selectedDuration, v => { selectedDuration = v; }));

    const beginBtn = el("button", "secondary-btn primary-btn", "Begin");
    beginBtn.type = "button";
    beginBtn.disabled = (selectedDuration === null);
    beginBtn.addEventListener("click", () => { playClickSound(); startGame(); });

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState("modeSelect"); });

    layer.appendChild(beginBtn);
    layer.appendChild(backBtn);
    app.appendChild(layer);
  }

  /* =========================================================
   * Game screen
   * ========================================================= */
  let hiddenInputEl = null;
  let boxRowEl = null;
  let wordDisplayEl = null;
  let categoryTagEl = null;
  let infinitiveLabelEl = null;
  let statusLineEl = null;
  let timerBarEl = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Flat pool of every (verb, tense, uniqueForm) triple allowed by the
  // current Verb Settings checkboxes — used directly as `currentPool` when
  // translateFirst is off (verbConjugationFeature.md §4.1).
  function buildConjugationPool() {
    const tenses = TENSE_OPTIONS.filter(t => selectedTenses[t]);
    const forms = PRONOUN_OPTIONS.filter(p => selectedPronouns[p]);
    const pool = [];
    VERB_BANK.forEach(verb => {
      tenses.forEach(tense => {
        forms.forEach(form => {
          pool.push({ kind: "verbConjugate", verb, tense, form });
        });
      });
    });
    return pool;
  }

  // Translate-first round unit: a shuffled verb order where each verb
  // expands into an adjacent [translate, conjugate] pair — advancing
  // through this queue one item at a time naturally alternates the two
  // steps for the same verb before moving to the next (§4.4).
  function buildVerbPassQueue() {
    const tenses = TENSE_OPTIONS.filter(t => selectedTenses[t]);
    const forms = PRONOUN_OPTIONS.filter(p => selectedPronouns[p]);
    // Translation Difficulty (renderVerbSettings) scopes which verbs' English
    // glosses get translated — a verb hard to conjugate isn't necessarily
    // hard to translate, so this filters independently of the tense/pronoun
    // checkboxes above.
    const verbPool = VERB_BANK.filter(v => v.difficulty === selectedVerbDifficulty);
    const queue = [];
    shuffle(verbPool).forEach(verb => {
      queue.push({ kind: "verbTranslate", verb });
      const tense = tenses[Math.floor(Math.random() * tenses.length)];
      const form = forms[Math.floor(Math.random() * forms.length)];
      queue.push({ kind: "verbConjugate", verb, tense, form });
    });
    return queue;
  }

  // Regenerates roundQueue for a fresh pass — called both at round start
  // and whenever nextWord() exhausts the current queue.
  function rebuildRoundQueue() {
    if (gameMode === "verb" && translateFirst) {
      roundQueue = buildVerbPassQueue();
    } else {
      roundQueue = shuffle(currentPool);
    }
  }

  // Title screen's "Quick Start" — bypasses every settings screen with a
  // fixed, predictable default (easy vocab, English->Portuguese, 30s).
  function quickStartVocab() {
    gameMode = "vocab";
    selectedDifficulty = "easy";
    selectedDuration = 30;
    displayLanguage = "en";
    startGame();
  }

  function startGame() {
    if (gameMode === "verb") {
      // When translateFirst is on, buildVerbPassQueue() (called by
      // rebuildRoundQueue() below) does its own difficulty-filtered shuffle
      // each time it regenerates — currentPool isn't consulted in that path.
      currentPool = translateFirst ? VERB_BANK.filter(v => v.difficulty === selectedVerbDifficulty) : buildConjugationPool();
    } else {
      currentPool = WORD_BANK.filter(w => w.difficulty === selectedDifficulty);
      if (displayLanguage === "pt") {
        // In this direction the English word is what the player types, so it
        // must be single-token too (space submits the answer — see 4.1).
        currentPool = currentPool.filter(w => !/\s/.test(w.en));
      }
    }
    rebuildRoundQueue();
    queueIndex = 0;
    score = 0;
    roundHistory = [];
    timeRemaining = selectedDuration;
    inputLocked = false;
    isNewHighScore = false;
    setState("game");
  }

  function nextWord() {
    if (queueIndex >= roundQueue.length) {
      rebuildRoundQueue();
      queueIndex = 0;
    }
    currentWord = roundQueue[queueIndex];
    queueIndex++;
    attemptCount = 0;
    showWord();
  }

  // Accepted answer(s) for the current prompt, kind-aware:
  // - vocab: "en" (default) shows the English word and expects the Portuguese
  //   answer; "pt" flips it — shows the Portuguese word and expects English.
  // - verbConjugate: the conjugated form for the prompt's tense/person.
  // - verbTranslate: the verb's Portuguese infinitive (already stored as
  //   `infinitive` — no separate field needed for this step's answer).
  function getAcceptedAnswers(promptEntry) {
    if (promptEntry.kind === "verbConjugate") {
      return [promptEntry.verb.conjugations[promptEntry.tense][promptEntry.form]];
    }
    if (promptEntry.kind === "verbTranslate") {
      return [promptEntry.verb.infinitive];
    }
    return displayLanguage === "pt" ? [promptEntry.en] : promptEntry.translations.pt;
  }
  function getPrimaryAnswer(promptEntry) {
    return getAcceptedAnswers(promptEntry)[0];
  }
  // Only used for the vocab kind's single-line word display — verb kinds are
  // rendered directly in showWord() since they need multiple text pieces
  // (pronoun label / infinitive / tense badge) instead of one string.
  function getPromptText(wordEntry) {
    return displayLanguage === "pt" ? wordEntry.translations.pt[0] : wordEntry.en;
  }

  function pickPronounLabel(form) {
    const aliases = PRONOUN_LABELS[form];
    return aliases[Math.floor(Math.random() * aliases.length)];
  }

  function showWord() {
    currentWordResolved = false;
    if (hiddenInputEl) hiddenInputEl.value = "";
    statusLineEl.textContent = "";
    statusLineEl.classList.remove("reveal-text");

    if (currentWord.kind === "verbConjugate") {
      categoryTagEl.className = "category-tag tense-badge";
      categoryTagEl.textContent = TENSE_LABELS[currentWord.tense];
      currentPronounLabel = pickPronounLabel(currentWord.form);
      wordDisplayEl.textContent = currentPronounLabel;
      infinitiveLabelEl.textContent = currentWord.verb.infinitive;
      infinitiveLabelEl.style.display = "";
    } else if (currentWord.kind === "verbTranslate") {
      categoryTagEl.className = "category-tag";
      categoryTagEl.textContent = "";
      wordDisplayEl.textContent = currentWord.verb.en;
      infinitiveLabelEl.textContent = "";
      infinitiveLabelEl.style.display = "none";
    } else {
      categoryTagEl.className = "category-tag";
      categoryTagEl.textContent = currentWord.category.replace("_", " ");
      wordDisplayEl.textContent = getPromptText(currentWord);
      infinitiveLabelEl.textContent = "";
      infinitiveLabelEl.style.display = "none";
    }

    boxRowEl.innerHTML = "";
    const answerLen = getPrimaryAnswer(currentWord).length;
    if (currentWord.kind === "verbConjugate") {
      // One wide box for the whole conjugated form — per-letter boxes are
      // for translating (vocab / verbTranslate), not for typing a
      // conjugation, which the player composes as a single word.
      boxRowEl.appendChild(el("div", "letter-box wide"));
    } else {
      for (let i = 0; i < answerLen; i++) {
        boxRowEl.appendChild(el("div", "letter-box"));
      }
    }
    if (hiddenInputEl) hiddenInputEl.maxLength = answerLen;
  }

  function updateBoxesFromInput(value) {
    const boxes = boxRowEl.children;
    // The single wide conjugation box mirrors the whole typed value, not
    // one letter per box.
    if (boxes.length === 1 && boxes[0].classList.contains("wide")) {
      boxes[0].textContent = value.toUpperCase();
      return;
    }
    for (let i = 0; i < boxes.length; i++) {
      boxes[i].textContent = value[i] ? value[i].toUpperCase() : "";
    }
  }

  function normalize(str) {
    return str
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .trim();
  }

  function isCorrect(input, wordEntry) {
    const normInput = normalize(input);
    return getAcceptedAnswers(wordEntry).some(ans => normalize(ans) === normInput);
  }

  function flashBoxes(className) {
    const boxes = boxRowEl.children;
    for (let i = 0; i < boxes.length; i++) {
      boxes[i].classList.remove("flash-correct", "flash-wrong", "flash-skip");
      // force reflow so the animation can retrigger on repeated wrong answers
      void boxes[i].offsetWidth;
      boxes[i].classList.add(className);
    }
  }

  function shakeBoxes() {
    boxRowEl.classList.remove("shake");
    void boxRowEl.offsetWidth;
    boxRowEl.classList.add("shake");
  }

  function showBonusPopup() {
    const popup = el("div", "bonus-popup", "Muito bom!");
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  // Builds the round-history entry for whatever prompt is currently active,
  // shaped per its kind (verbConjugationFeature.md §4.6) — this is what
  // powers the Score screen's answers list (renderScore, below).
  function buildHistoryEntry(correct) {
    if (currentWord.kind === "verbConjugate") {
      return {
        type: "conjugate",
        pronounLabel: currentPronounLabel,
        infinitive: currentWord.verb.infinitive,
        tense: currentWord.tense,
        answer: getPrimaryAnswer(currentWord),
        correct: correct
      };
    }
    if (currentWord.kind === "verbTranslate") {
      return { type: "translate", en: currentWord.verb.en, infinitive: currentWord.verb.infinitive, correct: correct };
    }
    return { type: "vocab", en: currentWord.en, pt: currentWord.translations.pt[0], correct: correct };
  }

  function submitAnswer() {
    if (inputLocked || !currentWord) return;
    const value = hiddenInputEl.value;
    const requiredLen = getPrimaryAnswer(currentWord).length;
    if (value.length !== requiredLen) {
      shakeBoxes();
      playBlipSound();
      return;
    }

    if (isCorrect(value, currentWord)) {
      flashBoxes("flash-correct");
      updateBoxesFromInput(getPrimaryAnswer(currentWord));
      showBonusPopup();
      playCorrectSound();
      score += 1;
      roundHistory.push(buildHistoryEntry(true));
      currentWordResolved = true;
      inputLocked = true;
      setTimeout(() => {
        inputLocked = false;
        if (state === "game") { nextWord(); focusHiddenInput(); }
      }, 600);
    } else {
      attemptCount += 1;
      flashBoxes("flash-wrong");
      shakeBoxes();
      playWrongSound();
      hiddenInputEl.value = "";
      setTimeout(() => updateBoxesFromInput(""), 150);

      if (attemptCount >= 3) {
        roundHistory.push(buildHistoryEntry(false));
        currentWordResolved = true;
        inputLocked = true;
        const boxes = boxRowEl.children;
        const answer = getPrimaryAnswer(currentWord);
        const revealedKind = currentWord.kind;
        const revealedLabel = currentPronounLabel;
        setTimeout(() => {
          if (boxes.length === 1 && boxes[0].classList.contains("wide")) {
            boxes[0].textContent = answer.toUpperCase();
            boxes[0].classList.add("reveal");
          } else {
            for (let i = 0; i < boxes.length; i++) {
              boxes[i].textContent = answer[i].toUpperCase();
              boxes[i].classList.add("reveal");
            }
          }
          // Conjugation prompts test the pronoun too, so the reveal shows
          // both — a bare form would be confusing feedback (§10).
          statusLineEl.textContent = revealedKind === "verbConjugate"
            ? revealedLabel + " → " + answer.toUpperCase()
            : answer.toUpperCase();
          statusLineEl.classList.add("reveal-text");
          playRevealSound();
        }, 200);
        setTimeout(() => {
          inputLocked = false;
          if (state === "game") { nextWord(); focusHiddenInput(); }
        }, 1700);
      } else {
        const triesLeft = 3 - attemptCount;
        statusLineEl.textContent = triesLeft === 1 ? "1 more try" : triesLeft + " more tries";
      }
    }
  }

  function skipWord() {
    if (inputLocked || !currentWord) return;
    roundHistory.push(buildHistoryEntry(null));
    currentWordResolved = true;
    flashBoxes("flash-skip");
    playSkipSound();
    inputLocked = true;
    setTimeout(() => {
      inputLocked = false;
      if (state === "game") { nextWord(); focusHiddenInput(); }
    }, 800);
  }

  function focusHiddenInput() {
    if (hiddenInputEl && state === "game") hiddenInputEl.focus();
  }

  function renderGame() {
    const layer = el("div", "content-layer game-layout");

    timerBarEl = el("div", "timer-bar", formatTime(timeRemaining));
    categoryTagEl = el("div", "category-tag", "");
    wordDisplayEl = el("div", "word-display", "");
    infinitiveLabelEl = el("div", "infinitive-label", "");
    infinitiveLabelEl.style.display = "none";
    boxRowEl = el("div", "box-row");
    statusLineEl = el("div", "status-line", "");

    hiddenInputEl = document.createElement("input");
    hiddenInputEl.type = "text";
    hiddenInputEl.className = "hidden-input";
    hiddenInputEl.autocomplete = "off";
    hiddenInputEl.autocapitalize = "off";
    hiddenInputEl.spellcheck = false;

    hiddenInputEl.addEventListener("input", () => {
      updateBoxesFromInput(hiddenInputEl.value);
    });
    hiddenInputEl.addEventListener("blur", () => {
      if (state === "game") setTimeout(focusHiddenInput, 0);
    });

    app.appendChild(timerBarEl);
    layer.appendChild(categoryTagEl);
    layer.appendChild(wordDisplayEl);
    layer.appendChild(infinitiveLabelEl);
    layer.appendChild(boxRowEl);
    layer.appendChild(statusLineEl);
    app.appendChild(layer);
    app.appendChild(hiddenInputEl);

    nextWord();
    focusHiddenInput();
    startTimer();
  }

  function formatTime(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function startTimer() {
    clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      timeRemaining -= 1;
      if (timerBarEl) {
        timerBarEl.textContent = formatTime(Math.max(timeRemaining, 0));
        timerBarEl.classList.toggle("low", timeRemaining <= 5);
      }
      if (timeRemaining > 0 && timeRemaining <= 5) {
        playTickSound();
      }
      if (timeRemaining <= 0) {
        clearInterval(timerHandle);
        endRound();
      }
    }, 1000);
  }

  function endRound() {
    playTimesUpSound();
    if (currentWord && !currentWordResolved) {
      roundHistory.push(buildHistoryEntry(null));
      currentWordResolved = true;
    }
    inputLocked = true;
    if (hiddenInputEl) hiddenInputEl.blur();
    isNewHighScore = recordHighScoreIfNeeded();
    setState("score");
  }

  /* =========================================================
   * Score screen
   * ========================================================= */
  // Same words/sec bar regardless of round length (7% easier than the
  // original 1.0/0.4/0.2 cutoffs — testing found the top tier too hard).
  function getResultTier() {
    const wordsPerSecond = score / selectedDuration;
    if (wordsPerSecond > 0.93) {
      return { className: "tier-fire", text: "Muito Quente, Bro! 🔥" };
    }
    if (wordsPerSecond >= 0.372) {
      return { className: "tier-good", text: "Parabéns!" };
    }
    if (wordsPerSecond >= 0.186) {
      return { className: "tier-meh", text: "Ainda tem muito o que aprender." };
    }
    return { className: "tier-bad", text: "Você é ruim..." };
  }

  function renderScore() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Time's Up!");
    heading.style.fontSize = "2rem";

    const scoreValue = el("div", "score-value", score + (score === 1 ? " wordji" : " wordjis"));

    const highScoreLine = el(
      "div",
      "high-score-line" + (isNewHighScore ? " new-high-score" : ""),
      isNewHighScore ? "New High Score! 🏆" : "High Score: " + getHighScore()
    );

    const tier = getResultTier();
    const resultMessage = el("div", "result-message " + tier.className, tier.text);

    let list;
    if (roundHistory.length === 0) {
      list = el("div", "answers-empty", "No wordjis were resolved this round.");
    } else {
      list = el("div", "answers-list");
      roundHistory.forEach(entry => {
        const rowClass = entry.correct === true ? "correct" : entry.correct === false ? "wrong" : "neutral";
        const mark = entry.correct === true ? "✓" : entry.correct === false ? "✗" : "-";
        let words;
        if (entry.type === "conjugate") {
          words = entry.pronounLabel + " " + entry.infinitive + " (" + TENSE_LABELS[entry.tense] + ") → " + entry.answer;
        } else if (entry.type === "translate") {
          words = entry.en + " → " + entry.infinitive;
        } else {
          words = displayLanguage === "pt" ? entry.pt + " → " + entry.en : entry.en + " → " + entry.pt;
        }
        const row = el("div", "answers-row " + rowClass);
        row.appendChild(el("div", "answers-words", words));
        row.appendChild(el("div", "answers-mark", mark));
        list.appendChild(row);
      });
    }

    const buttonRow = el("div", "score-buttons");
    const replayBtn = el("button", "secondary-btn primary-btn", "Replay");
    replayBtn.type = "button";
    replayBtn.addEventListener("click", () => { playClickSound(); startGame(); });
    const restartBtn = el("button", "secondary-btn", "Restart");
    restartBtn.type = "button";
    restartBtn.addEventListener("click", () => { playClickSound(); setState("title"); });
    buttonRow.appendChild(replayBtn);
    buttonRow.appendChild(restartBtn);

    layer.appendChild(heading);
    layer.appendChild(scoreValue);
    layer.appendChild(highScoreLine);
    layer.appendChild(resultMessage);
    layer.appendChild(list);
    layer.appendChild(buttonRow);
    app.appendChild(layer);
  }

  /* =========================================================
   * High scores screen — every recorded best across both modes, reached
   * via the trophy button from anywhere; returns to whatever screen it
   * was opened from (same return-state pattern as name entry).
   * ========================================================= */
  function buildVocabHighScoreRows() {
    const scores = loadScoresFromKey(HIGH_SCORE_STORAGE_KEY);
    return Object.keys(scores).map(key => {
      const [difficulty, lang, duration] = key.split("_");
      return {
        label: DIFFICULTY_LABELS[difficulty] + " · " + LANGUAGE_LABELS[lang] + " · " + duration + "s",
        score: scores[key]
      };
    }).sort((a, b) => b.score - a.score);
  }

  function buildVerbHighScoreRows() {
    const scores = loadScoresFromKey(VERB_HIGH_SCORE_STORAGE_KEY);
    return Object.keys(scores).map(key => {
      const [mode, duration] = key.split("_");
      return {
        label: (mode === "translate" ? "Translate First" : "Direct") + " · " + duration + "s",
        score: scores[key]
      };
    }).sort((a, b) => b.score - a.score);
  }

  function buildHighScoreSection(title, rows) {
    const wrap = document.createDocumentFragment();
    wrap.appendChild(el("div", "settings-section-label", title));
    if (rows.length === 0) {
      wrap.appendChild(el("div", "answers-empty", "No high scores yet."));
    } else {
      rows.forEach(row => {
        const rowEl = el("div", "answers-row");
        rowEl.appendChild(el("div", "answers-words", row.label));
        rowEl.appendChild(el("div", "answers-mark", String(row.score)));
        wrap.appendChild(rowEl);
      });
    }
    return wrap;
  }

  function renderHighScores() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", userName ? userName + " High Score" : "High Scores");
    heading.style.fontSize = "2rem";

    const panel = el("div", "highscore-panel");
    panel.appendChild(buildHighScoreSection("Vocabulário", buildVocabHighScoreRows()));
    panel.appendChild(buildHighScoreSection("Verbos", buildVerbHighScoreRows()));

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState(highScoresReturnState); });

    layer.appendChild(heading);
    layer.appendChild(panel);
    layer.appendChild(backBtn);
    app.appendChild(layer);
  }

  /* =========================================================
   * Help screen — replaces the old per-mode "How to Play" screens that
   * used to sit in the middle of the flow; this is a standalone reference
   * covering both modes at once, reachable from anywhere via the ? button.
   * ========================================================= */
  function buildHelpSection(title, lines) {
    const wrap = document.createDocumentFragment();
    wrap.appendChild(el("div", "settings-section-label", title));
    const list = document.createElement("ul");
    lines.forEach(line => list.appendChild(el("li", "", line)));
    wrap.appendChild(list);
    return wrap;
  }

  function renderHelp() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Game Modes");
    heading.style.fontSize = "2rem";

    const box = el("div", "instructions-box");
    box.appendChild(buildHelpSection("Vocabulário", [
      "Translate everyday words between English and Portuguese.",
      "A word appears — type the translation, one letter box per letter.",
      "Press SPACE or ENTER to submit.",
      "You have 3 tries to get each word right.",
      "Press TAB to skip a word.",
      "Score as many as you can before time runs out."
    ]));
    box.appendChild(buildHelpSection("Verbos", [
      "Conjugate Portuguese verbs across pronouns and tenses you choose.",
      "You'll see a pronoun, a verb, and a tense — type the conjugated form in the single wide box.",
      "Optionally translate the verb's English gloss first, before conjugating it.",
      "Press SPACE or ENTER to submit.",
      "You have 3 tries to get each one right.",
      "Press TAB to skip.",
      "Score as many as you can before time runs out."
    ]));

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState(helpReturnState); });

    layer.appendChild(heading);
    layer.appendChild(box);
    layer.appendChild(backBtn);
    app.appendChild(layer);
  }

  /* =========================================================
   * Settings screen — name (view + edit) and clearing high scores,
   * reached via the gear button from anywhere.
   * ========================================================= */
  function buildClearConfirmModal() {
    const backdrop = el("div", "modal-backdrop");
    const card = el("div", "modal-card");
    card.appendChild(el("div", "modal-title", "Clear all high scores?"));
    card.appendChild(el("div", "modal-text", "This clears every recorded best for both Vocabulário and Verbos. This cannot be undone."));

    const buttonRow = el("div", "score-buttons");
    const confirmBtn = el("button", "secondary-btn danger-btn", "Clear");
    confirmBtn.type = "button";
    confirmBtn.addEventListener("click", () => {
      saveScoresToKey(HIGH_SCORE_STORAGE_KEY, {});
      saveScoresToKey(VERB_HIGH_SCORE_STORAGE_KEY, {});
      showClearConfirm = false;
      playClickSound();
      render();
    });
    const cancelBtn = el("button", "secondary-btn", "Cancel");
    cancelBtn.type = "button";
    cancelBtn.addEventListener("click", () => { showClearConfirm = false; playClickSound(); render(); });
    buttonRow.appendChild(confirmBtn);
    buttonRow.appendChild(cancelBtn);
    card.appendChild(buttonRow);

    backdrop.appendChild(card);
    // Clicking the scrim (not the card) also cancels — standard modal UX.
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) { showClearConfirm = false; playClickSound(); render(); }
    });
    return backdrop;
  }

  function renderSettings() {
    const layer = el("div", "content-layer");
    const heading = el("h2", "title-text", "Settings");
    heading.style.fontSize = "2rem";

    const nameLabel = el("div", "settings-section-label", "Name");
    const nameRow = el("div", "settings-row");
    nameRow.appendChild(el("div", "settings-value", userName || "Not set"));
    const editNameBtn = el("button", "secondary-btn", "Edit");
    editNameBtn.type = "button";
    editNameBtn.addEventListener("click", () => {
      playClickSound();
      nameEntryReturnState = "settings";
      setState("nameEntry");
    });
    nameRow.appendChild(editNameBtn);

    const highScoreLabel = el("div", "settings-section-label", "High Scores");
    const clearBtn = el("button", "secondary-btn danger-btn", "Clear High Scores");
    clearBtn.type = "button";
    clearBtn.addEventListener("click", () => {
      playClickSound();
      showClearConfirm = true;
      render();
    });

    const backBtn = el("button", "back-link", "← Back");
    backBtn.type = "button";
    backBtn.addEventListener("click", () => { playClickSound(); setState(settingsReturnState); });

    layer.appendChild(heading);
    layer.appendChild(nameLabel);
    layer.appendChild(nameRow);
    layer.appendChild(highScoreLabel);
    layer.appendChild(clearBtn);
    layer.appendChild(backBtn);
    app.appendChild(layer);

    if (showClearConfirm) app.appendChild(buildClearConfirmModal());
  }

  /* =========================================================
   * Global key handling
   * ========================================================= */
  document.addEventListener("keydown", (e) => {
    // The clear-high-scores confirmation is an overlay, not a navigation
    // state — intercept first so no screen-level shortcut fires underneath
    // it. Escape cancels; Enter is deliberately NOT bound to Confirm, so a
    // stray Enter press can't wipe high scores.
    if (showClearConfirm) {
      if (e.key === "Escape") { playClickSound(); showClearConfirm = false; render(); }
      return;
    }
    if (state === "title") {
      if (e.key === "Enter" || e.key === "1") { playClickSound(); setState("modeSelect"); return; }
      if (e.key === "Escape" || e.key === "2") { playClickSound(); quickStartVocab(); return; }
      return;
    }
    if (state === "highScores") {
      if (e.key === "Escape" || e.key === "Enter") { playClickSound(); setState(highScoresReturnState); }
      return;
    }
    if (state === "nameEntry") {
      // Enter/typing are handled on the input itself (see renderNameEntry).
      // This screen is only ever reached voluntarily (via Settings' Edit
      // button) now, so Escape always cancels back — no forced-first-run case.
      if (e.key === "Escape") { playClickSound(); setState(nameEntryReturnState); }
      return;
    }
    if (state === "help") {
      if (e.key === "Escape" || e.key === "Enter") { playClickSound(); setState(helpReturnState); }
      return;
    }
    if (state === "settings") {
      if (e.key === "Escape") { playClickSound(); setState(settingsReturnState); }
      return;
    }
    if (state === "modeSelect") {
      if (e.key === "Enter") {
        if (gameMode === null) return; // Continue is disabled until a mode is picked
        playClickSound();
        goToModeNextScreen();
        return;
      }
      if (e.key === "Escape") { playClickSound(); setState("title"); return; }
      if (e.key === "1") { gameMode = "vocab"; playClickSound(); render(); return; }
      if (e.key === "2") { gameMode = "verb"; playClickSound(); render(); return; }
      if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowUp") {
        const idx = MODE_OPTIONS.indexOf(gameMode);
        const dir = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
        gameMode = MODE_OPTIONS[(idx + dir + MODE_OPTIONS.length) % MODE_OPTIONS.length];
        playClickSound();
        render();
        return;
      }
      return;
    }
    if (state === "vocabSettings") {
      if (e.key === "Enter") {
        if (!(displayLanguage && selectedDifficulty && selectedDuration)) return; // Begin is disabled until all three are picked
        playClickSound();
        startGame();
        return;
      }
      if (e.key === "Escape") { playClickSound(); setState("modeSelect"); return; }
      return;
    }
    if (state === "verbSettings") {
      if (e.key === "Enter") {
        if (selectedDuration === null) return; // Begin is disabled until a length is picked
        playClickSound();
        startGame();
        return;
      }
      if (e.key === "Escape") { playClickSound(); setState("modeSelect"); return; }
      return;
    }
    if (state === "game") {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        submitAnswer();
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        skipWord();
        return;
      }
      return;
    }
    if (state === "score") {
      if (e.key === "Enter") { playClickSound(); startGame(); return; }
      if (e.key === "Escape") { playClickSound(); setState("title"); return; }
      return;
    }
  });

  initMuteButton();
  initSettingsButton();
  initDarkModeButton();
  initHighScoreButton();
  initHelpButton();
  render();
})();
</script>
</body>
</html>
